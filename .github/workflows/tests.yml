name: tests
on: [push, pull_request]

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Run tests
        run: pytest -v
      - name: Run end-to-end
        run: python benchmarks/run_end_to_end.py

  cuda-compile-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nvcc + CUDA dev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y nvidia-cuda-toolkit
      - name: Compile-check CUDA (no GPU needed)
        run: make -C csrc compile-check ARCH=sm_75
